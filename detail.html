<!--
Asset Map:
- Background image: Reference/ChatGPT Image May 23, 2026, 04_29_42 PM.png
- This page shows the clicked product image larger.
- Use query parameter img= with a relative path from this folder.
- Example: detail.html?img=Reference/Screenshot%202026-05-23%20at%204.16.00%20PM.png&title=Superior%20Exotics%20Detail
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Superior Exotics Image Detail</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #080808 url("Reference/ChatGPT Image May 23, 2026, 04_29_42 PM.png") top center no-repeat;
      background-color: #040404;
      color: #fff;
      font: 12px/1.4 "Arial", "Helvetica", sans-serif;
      overflow-x: hidden;
    }
    #detail-wrapper {
      width: 941px;
      max-width: calc(100vw - 24px);
      margin: 36px auto 48px;
      padding: 14px;
      border: 2px solid #ffd800;
      background: rgba(0, 0, 0, 0.88);
    }
    .site-header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #444;
    }
    .site-title-graphic {
      display: block;
      width: min(140px, 23%);
      height: auto;
      margin: 0 auto 10px;
      filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 8px rgba(0, 0, 0, 0.65));
    }
    .site-header .tagline {
      display: inline-block;
      padding: 5px 9px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 221, 0, 0.45);
      color: #fff4b8;
      font-size: 14px;
      line-height: 1.4;
      text-shadow: 1px 1px 0 #000, 0 0 4px #000;
    }
    #page-title {
      margin: 0 0 12px;
      color: #ffcc00;
      font-size: 24px;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #000;
    }
    #detail-wrapper .nav {
      margin-bottom: 14px;
      padding: 8px;
      border: 2px solid #444;
      background: rgba(0, 0, 0, 0.78);
    }
    #detail-wrapper .nav a {
      color: #fff17a;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 1px 1px 0 #000;
    }
    #detail-wrapper .nav a:hover {
      text-decoration: underline;
    }
    #detail-image {
      padding: 10px;
      border: 2px solid #ff0000;
      background: rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    #detail-image img {
      max-width: 100%;
      border: 1px solid #444;
      background: transparent;
      display: inline-block;
      image-rendering: pixelated;
    }
    #detail-image .missing {
      color: #f55;
      font-size: 14px;
      padding: 40px;
    }
    .note-box {
      margin-top: 12px;
      padding: 10px;
      border: 1px dashed #999;
      background: rgba(0, 0, 0, 0.86);
      color: #f0f0f0;
      font-size: 12px;
      text-shadow: 1px 1px 0 #000;
    }
  </style>
</head>
<body>
  <div id="detail-wrapper">
    <div class="site-header">
      <img class="site-title-graphic" src="Website Assets/title1.png" alt="Superior Exotics" />
      <div class="tagline">Fine imported snacks and novelty items. Rare flavors and exotic combinations sourced from specialty producers.</div>
    </div>
    <h2 id="page-title">Superior Exotics</h2>
    <div class="nav">
      <a href="index.html">&larr; Back to Superior Exotics 2</a>
    </div>
    <div id="detail-image">
      <div class="missing">Loading image...</div>
    </div>
    <div class="note-box">
      Clicked image detail view. Replace query string with the local product image path.
    </div>
  </div>
  <script>
    function decode(param) {
      try {
        return decodeURIComponent(param.replace(/\+/g, ' '));
      } catch (e) {
        return param;
      }
    }
    var search = window.location.search.substring(1);
    var parts = search.split('&');
    var img = '';
    var title = 'Superior Exotics';
    for (var i = 0; i < parts.length; i++) {
      var pair = parts[i].split('=');
      if (pair[0] === 'img') {
        img = decode(pair.slice(1).join('='));
      }
      if (pair[0] === 'title') {
        title = decode(pair.slice(1).join('='));
      }
    }
    var container = document.getElementById('detail-image');
    var pageTitle = document.getElementById('page-title');
    pageTitle.textContent = title;
    document.title = title + ' | Superior Exotics';
    if (img) {
      container.innerHTML = '<img src="' + img + '" alt="' + title + '" />';
    } else {
      container.innerHTML = '<div class="missing">No image selected. Use the local image path in the query string.</div>';
    }
  </script>
</body>
</html>
