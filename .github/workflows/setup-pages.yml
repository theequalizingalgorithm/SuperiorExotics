name: Setup GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages from main root
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = { branch: 'main', path: '/' };

            try {
              await github.rest.repos.getPages({ owner, repo });
              await github.rest.repos.createPagesSite({ owner, repo, source });
              console.log('Updated GitHub Pages source to main root.');
            } catch (error) {
              if (error.status === 409) {
                console.log('GitHub Pages already configured.');
              } else if (error.status === 404) {
                await github.rest.repos.createPagesSite({ owner, repo, source });
                console.log('Created GitHub Pages site using main root.');
              } else {
                throw error;
              }
            }
